<rect x="77.9" y="102.0" width="76.7" height="18" rx="5" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/><text x="84.9" y="114.5" class="tag" fill="#58a6ff">Review Gate</text>
<rect x="160.6" y="102.0" width="71.0" height="18" rx="5" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/><text x="167.6" y="114.5" class="tag" fill="#58a6ff">Rate Limit</text>
