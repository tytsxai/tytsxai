<svg xmlns="http://www.w3.org/2000/svg" width="430" height="136" viewBox="0 0 430 136" role="img">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.kicker{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10.5px;letter-spacing:2px;font-weight:700;fill:#58a6ff}
.label{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;letter-spacing:1.4px;font-weight:600;fill:#6e7681}
.body{font-size:12px;fill:#8b949e}
.ink{font-size:12px;fill:#e6edf3}
.name{font-size:52px;font-weight:700;letter-spacing:-1px;fill:#e6edf3}
.handle{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:20px;font-weight:600;fill:#8b949e}
.role{font-size:15px;font-weight:600;fill:#e6edf3}
.num{font-size:26px;font-weight:700;letter-spacing:-0.5px}
.repo{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;font-weight:700;fill:#58a6ff}
.chip{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:500;fill:#e6edf3}
.tag{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:9.5px;font-weight:600}
</style>
<rect x="0.5" y="0.5" width="429" height="135" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="18" y="34" class="repo">PromptPanel</text>
<text x="412" y="34" class="chip" font-weight="700" text-anchor="end" fill="#e3b341">★ 5</text>
<text x="376.2" y="34" class="label" text-anchor="end">SWIFT</text>
<circle cx="330.2" cy="30" r="4" fill="#F05138"/>
<text x="18" y="62" class="body">macOS 原生的提示词与片段启动器，全局快捷键唤起，纯本地存储。</text>
<rect x="18.0" y="102.0" width="42.5" height="18" rx="5" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/><text x="25.0" y="114.5" class="tag" fill="#58a6ff">Swift</text>
<rect x="66.5" y="102.0" width="53.9" height="18" rx="5" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/><text x="73.5" y="114.5" class="tag" fill="#58a6ff">SwiftUI</text>
<rect x="126.4" y="102.0" width="76.7" height="18" rx="5" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/><text x="133.4" y="114.5" class="tag" fill="#58a6ff">Local-First</text>
</svg>
